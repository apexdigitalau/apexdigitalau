<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Apex CRM</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f19;
        color: #e2e8f0;
        text-align: center;
        padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; color: #94a3b8; margin: 0 0 1.5rem; }
      button {
        font: inherit;
        font-size: 0.875rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Apex CRM needs a connection to load your leads.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
